# Slack app manifest: api.slack.com/apps -> Create New App -> From a manifest.
display_information:
  name: PAC
  description: Ask PAC, answer its questions, and approve what of yours is shared.
features:
  bot_user:
    display_name: PAC
    always_online: true
  app_home:
    messages_tab_enabled: true
    messages_tab_read_only_enabled: false
  slash_commands:
    - command: /pac
      description: Ask PAC a question, or /pac status | asks | help
      usage_hint: "<question> | status | asks | help"
      should_escape: false
oauth_config:
  scopes:
    bot:
      - chat:write
      - commands
      - im:history
      - im:read
      - im:write
settings:
  event_subscriptions:
    bot_events:
      - message.im
  interactivity:
    is_enabled: true
  org_deploy_enabled: false
  socket_mode_enabled: true
  token_rotation_enabled: false
